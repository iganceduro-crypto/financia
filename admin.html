<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FINANCIA - Administration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="admin-header">
        <div class="container">
            <h1>FINANCIA</h1>
            <p>Tableau de bord administrateur</p>
        </div>
    </header>


    <!-- DASHBOARD -->
    <main class="admin-container">

        <div class="admin-title">
            <h2>Tableau de bord</h2>
            <p>Gestion des demandes de crédit</p>
        </div>


        <!-- STATISTIQUES -->
        <section class="stats">

            <div class="stat-card">
                <h3>Demandes</h3>
                <strong id="totalDemandes">0</strong>
            </div>

            <div class="stat-card">
                <h3>En attente</h3>
                <strong id="demandesAttente">0</strong>
            </div>

            <div class="stat-card">
                <h3>Approuvées</h3>
                <strong id="demandesApprouvees">0</strong>
            </div>

            <div class="stat-card">
                <h3>Refusées</h3>
                <strong id="demandesRefusees">0</strong>
            </div>

        </section>


        <!-- DEMANDES -->
        <section class="demandes-section">

            <h2>Demandes de crédit</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Client</th>
                            <th>Téléphone</th>
                            <th>Type</th>
                            <th>Montant</th>
                            <th>Durée</th>
                            <th>Statut</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="listeDemandes"></tbody>

                </table>

            </div>

        </section>

        <section class="demandes-section" style="margin-top: 28px;">
            <h2>Paramètres administrateur</h2>
            <form id="adminSettingsForm" style="display:flex; flex-direction:column; gap:12px; max-width: 500px;">
                <div>
                    <label for="adminUsername" style="display:block; margin-bottom:6px; font-weight:bold;">Nom d’utilisateur</label>
                    <input id="adminUsername" type="text" name="username" placeholder="Nom d’utilisateur" style="width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px;" required>
                </div>

                <div>
                    <label for="adminCurrentPassword" style="display:block; margin-bottom:6px; font-weight:bold;">Mot de passe actuel</label>
                    <input id="adminCurrentPassword" type="password" name="currentPassword" placeholder="Mot de passe actuel" style="width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px;" required>
                </div>

                <div>
                    <label for="adminNewPassword" style="display:block; margin-bottom:6px; font-weight:bold;">Nouveau mot de passe</label>
                    <input id="adminNewPassword" type="password" name="password" placeholder="Nouveau mot de passe" style="width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px;" required>
                </div>

                <button type="submit" class="btn-voir" style="width:max-content;">Enregistrer</button>
            </form>
            <div id="adminSettingsMessage" style="margin-top: 12px; min-height: 22px; font-weight: 600;"></div>
        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="admin.js"></script>
    <script>
        const adminSettingsForm = document.getElementById('adminSettingsForm');
        const adminSettingsMessage = document.getElementById('adminSettingsMessage');
        const adminUsernameInput = document.getElementById('adminUsername');

        async function verifierSessionAdmin() {
            try {
                const res = await fetch('/api/session');
                const data = await res.json();
                if (!data.authenticated) {
                    window.location.href = '/admin-login.html';
                    return;
                }

                const settingsResponse = await fetch('/api/admin/settings', { credentials: 'same-origin' });
                const settingsData = await settingsResponse.json();
                if (!settingsResponse.ok) {
                    throw new Error(settingsData.message || 'Erreur de chargement des paramètres.');
                }

                adminUsernameInput.value = settingsData.username || '';
            } catch (error) {
                console.error(error);
                window.location.href = '/admin-login.html';
            }
        }

        adminSettingsForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            adminSettingsMessage.textContent = '';
            adminSettingsMessage.style.color = '#0f172a';

            const username = adminUsernameInput.value.trim();
            const currentPassword = document.getElementById('adminCurrentPassword').value;
            const newPassword = document.getElementById('adminNewPassword').value;

            try {
                const response = await fetch('/api/admin/settings', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        username,
                        password: newPassword,
                        currentPassword
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Impossible de modifier les paramètres.');
                }

                adminSettingsMessage.textContent = data.message || 'Paramètres enregistrés.';
                adminSettingsMessage.style.color = '#166534';
                document.getElementById('adminCurrentPassword').value = '';
                document.getElementById('adminNewPassword').value = '';
            } catch (error) {
                adminSettingsMessage.textContent = error.message;
                adminSettingsMessage.style.color = '#991b1b';
            }
        });

        verifierSessionAdmin();
    </script>

</body>
</html>
